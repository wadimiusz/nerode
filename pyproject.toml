[project]
name = "nerode"
version = "0.1.0"
description = "Where does a transformer keep its state? Myhill–Nerode classes in the residual stream of a small GPT trained on probabilistic automata"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vadim Fomin", email = "wadimiusz@gmail.com" }]
dependencies = [
    "nanogpt",
    "numpy>=2.5.2",
    "torch>=2.13.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.10"]

[tool.uv.sources]
# The model (GPT, Config) comes from nanogpt, pinned to a commit so that the
# results in results/ stay reproducible. Bump the rev on purpose, not by accident.
nanogpt = { git = "https://github.com/wadimiusz/nanogpt", rev = "f51d8f15acd44870618c8de3dd1c36ad2f9bff8d" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nerode"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

# ---------------------------------------------------------------------------
# ruff and mypy: the same settings as in nanogpt (see its pyproject.toml for
# the reasoning and the measurements behind them).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# C408 wants list()/dict()/tuple() rewritten as literals: taste, not correctness.
ignore = ["C408"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
exclude = '^\.venv/'
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# No py.typed and no stubs: do not require them.
[[tool.mypy.overrides]]
module = [
    "matplotlib",
    "matplotlib.*",
    "tqdm",
    "tqdm.*",
]
ignore_missing_imports = true

# nanogpt ships no py.typed marker either, but its source is annotated, so let
# mypy read the installed package instead of treating GPT and Config as Any.
[[tool.mypy.overrides]]
module = ["nanogpt", "nanogpt.*"]
follow_untyped_imports = true
